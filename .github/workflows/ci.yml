name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref (keeps PR feedback fast).
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Makefile RELEASE_VERSION / firmware DOCKER_IMAGE.
  DOCKER_IMAGE: sylverb/retro-go-sd-builder:v1.5

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project_kind: ${{ steps.meta.outputs.project_kind }}
      packed_bin: ${{ steps.meta.outputs.packed_bin }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read project metadata
        id: meta
        run: |
          set -euo pipefail
          PROJECT_KIND="$(make --no-print-directory -f Makefile print-PROJECT_KIND)"
          PACKED_BIN="$(make --no-print-directory -f Makefile print-PACKED_BIN)"
          echo "project_kind=${PROJECT_KIND}" >> "${GITHUB_OUTPUT}"
          echo "packed_bin=${PACKED_BIN}" >> "${GITHUB_OUTPUT}"
          echo "PROJECT_KIND=${PROJECT_KIND}"
          echo "PACKED_BIN=${PACKED_BIN}"

      - name: Build (Docker)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/opt/workdir" \
            -w /opt/workdir \
            "${{ env.DOCKER_IMAGE }}" \
            make --no-print-directory -j"$(nproc)" all

      - name: Upload packed binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: packed-bin
          path: ${{ steps.meta.outputs.packed_bin }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download packed binary
        uses: actions/download-artifact@v4
        with:
          name: packed-bin
          path: dist

      - name: Stage release assets
        run: |
          set -euo pipefail
          PACKED_BIN="${{ needs.build.outputs.packed_bin }}"
          python3 scripts/stage_release.py \
            --bin "dist/${PACKED_BIN}" \
            --tag "${GITHUB_REF_NAME}" \
            --out release \
            --docker-image "${{ env.DOCKER_IMAGE }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mapfile -t names < release/release-files.txt
          files=()
          for name in "${names[@]}"; do
            files+=("release/${name}")
          done
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release/RELEASE_NOTES.md \
            "${files[@]}"
